services:
  auth-service:
    build:
      context: ./backend/auth-service
      target: base
    ports:
      - "3001:3000"
    volumes:
      - ./backend/auth-service:/app
      - /app/node_modules
    command: >
      sh -c "npm install --loglevel=notice &&
             npx tsc-watch --noClear --onSuccess 'node --enable-source-maps dist/index.js'"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  shortener-service:
    build:
      context: ./backend/shortener-service
      target: base
    ports:
      - "3002:3000"
    volumes:
      - ./backend/shortener-service:/app
      - /app/node_modules
    command: >
      sh -c "npm install --loglevel=notice &&
             npx tsc-watch --noClear --onSuccess 'node --enable-source-maps dist/index.js'"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  audit-log-service:
    build:
      context: ./backend/audit-log-service
      target: base
    ports:
      - "3003:3000"
    volumes:
      - ./backend/audit-log-service:/app
      - /app/node_modules
    command: >
      sh -c "npm install --loglevel=notice &&
             npx tsc-watch --noClear --onSuccess 'node --enable-source-maps dist/index.js'"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend-network:
    driver: bridge
